name: Deploy Lit Site to Droplet

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Match this to your local development version

    - name: Install Dependencies
      run: npm ci
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Build Lit Project
      run: npm run build
      # Note: Ensure your package.json build script outputs to the directory specified below.

    - name: Deploy to DigitalOcean Droplet
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "." 
        target: "/opt/webstacks/apps/seanbeck/client/dist"